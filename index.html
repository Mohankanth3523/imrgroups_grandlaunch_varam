<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5FAFC" />
    <meta name="robots" content="index, follow" />
    <title>Varam Classic Garden — Grand Launch Invitation</title>
    <meta
      name="description"
      content="You are cordially invited — Grand Launch of Varam Classic Garden by IMR Groups, 27 September 2026. Premium gated-community plots in Hosur, Tamil Nadu."
    />

    <!-- Open Graph / WhatsApp & social link-preview tags. og:image and
         og:url use relative paths, which resolve correctly against
         whatever domain this is deployed to (Cloudflare Pages default
         *.pages.dev subdomain, or a later custom domain) — no edits
         needed after deploying. -->
    <meta property="og:title" content="Varam Classic Garden — Grand Launch" />
    <meta
      property="og:description"
      content="You & your family are cordially invited. Grand Launch — 27 September 2026. Plots starting from ₹18 Lakhs onwards."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/master-plan.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Varam Classic Garden — Grand Launch" />
    <meta
      name="twitter:description"
      content="You & your family are cordially invited. Grand Launch — 27 September 2026. Plots starting from ₹18 Lakhs onwards."
    />
    <meta name="twitter:image" content="/assets/master-plan.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
